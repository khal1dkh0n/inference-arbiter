  - id: CQ-08
    question: |
      Write a Python function with this signature:

      def bitmap_fields(bitmap_hex: str) -> list[int]

      `bitmap_hex` is an ISO 8583 bitmap written as hexadecimal characters, upper or lower case. The primary bitmap is 16 hex characters (64 bits). Bit 1 is the most significant bit of the first byte, bit 8 the least significant bit of the first byte, bit 9 the most significant bit of the second byte, and so on. Bit n set means field n is present.

      When bit 1 is set, a secondary bitmap of another 16 hex characters must follow directly, and it covers fields 65 to 128 in the same way. When bit 1 is clear there must be no secondary bitmap.

      Return the numbers of the fields that are present, in ascending order, without field 1 itself. Raise ValueError when the string contains a character that is not a hex digit, when bit 1 is clear and the length is not 16, or when bit 1 is set and the length is not 32.
    expected_answer: "A module whose function bitmap_fields passes eval/code_reference/CQ-08_tests.py."
    match:
      type: reference_tests
      function: bitmap_fields
      tests: eval/code_reference/CQ-08_tests.py
    category: parsing
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-08.py
    broken_solutions:
      - eval/code_reference/CQ-08_broken_1.py
      - eval/code_reference/CQ-08_broken_2.py
    notes: "Bit numbering from the most significant bit; the secondary bitmap is required exactly when bit 1 is set. The 20-field example was decoded by hand, byte by byte."

  - id: CQ-09
    question: |
      Write a Python function with this signature:

      def roman_to_int(text: str) -> int

      It converts a Roman numeral to an integer. Only the canonical numerals of the numbers 1 to 3999 are accepted, written with the uppercase letters I, V, X, L, C, D, M. Canonical means the one standard way to write the number: the subtractive pairs IV, IX, XL, XC, CD and CM are used wherever they apply and nowhere else, so 4 is "IV" and not "IIII", 99 is "XCIX" and not "IC", and 1990 is "MCMXC".

      Raise ValueError for any string that is not the canonical numeral of a number from 1 to 3999. That includes the empty string, lowercase letters, other characters, and non-canonical forms such as "IIII", "VV", "IC", "XM", "IVI" and "MMMM".
    expected_answer: "A module whose function roman_to_int passes eval/code_reference/CQ-09_tests.py."
    match:
      type: reference_tests
      function: roman_to_int
      tests: eval/code_reference/CQ-09_tests.py
    category: parsing
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-09.py
    broken_solutions:
      - eval/code_reference/CQ-09_broken_1.py
      - eval/code_reference/CQ-09_broken_2.py
    notes: "Strict: the hard part is rejecting non-canonical forms, not the conversion."

