# Code question set, v1 (20 cases). Schema, grading and rules: eval/README.md, "Code set".
# Every case asks for one Python function with a stated signature. An answer is graded by running
# its code against the reference tests named in `match.tests`, in the sandbox. The reference
# files under eval/code_reference/ are never part of a prompt.
version: 1
cases:
  - id: CQ-01
    question: |
      Write a Python function with this signature:

      def luhn_check_digit(payload: str) -> int

      It returns the Luhn check digit for `payload`, which is the number without its check digit. The check digit is the one digit that, appended to the payload, makes the full number pass the Luhn check: starting from the rightmost digit of the full number and moving left, every second digit is doubled, 9 is subtracted from any doubled value above 9, and the sum of all the digits is a multiple of 10.

      `payload` must be a non-empty string of the ASCII digits 0-9. Raise ValueError for anything else: an empty string, spaces, a sign, letters.
    expected_answer: "A module whose function luhn_check_digit passes eval/code_reference/CQ-01_tests.py."
    match:
      type: reference_tests
      function: luhn_check_digit
      tests: eval/code_reference/CQ-01_tests.py
    category: encoding
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-01.py
    broken_solutions:
      - eval/code_reference/CQ-01_broken_1.py
      - eval/code_reference/CQ-01_broken_2.py
    notes: "Doubling starts at the payload's last digit, because the check digit takes the rightmost place. Expected values from the reference solution; 7992739871 -> 3 and 411111111111111 -> 1 are the usual published examples."

  - id: CQ-02
    question: |
      Write a Python function with this signature:

      def parse_tlv(data: bytes) -> list[tuple[str, bytes]]

      It parses a sequence of BER-TLV objects and returns one (tag, value) pair per object, in order, with the tag as an uppercase hex string. Parse the top level only: do not descend into the value of any object.

      Rules:
      - Tag: the first byte starts the tag. If its low five bits are all ones (byte & 0x1F == 0x1F), the tag continues: every following byte belongs to the tag, and the last tag byte is the first one whose top bit (0x80) is clear.
      - Length: a first length byte below 0x80 is the length itself. 0x81 means the next one byte is the length. 0x82 means the next two bytes are the length, big-endian. Any other first length byte raises ValueError.
      - A 0x00 byte where a tag would start is padding and is skipped.
      - Raise ValueError when the data ends inside a tag, a length or a value.
      - Empty data returns an empty list.
    expected_answer: "A module whose function parse_tlv passes eval/code_reference/CQ-02_tests.py."
    match:
      type: reference_tests
      function: parse_tlv
      tests: eval/code_reference/CQ-02_tests.py
    category: parsing
    expected_route: mid
    difficulty: hard
    reference_solution: eval/code_reference/CQ-02.py
    broken_solutions:
      - eval/code_reference/CQ-02_broken_1.py
      - eval/code_reference/CQ-02_broken_2.py
    notes: "Multi-byte tags, the two long length forms, padding and truncation. The rules are stated in the question; they follow BER as used by EMV."

  - id: CQ-03
    question: |
      Write a Python function with this signature:

      def to_minor_units(amount: str, exponent: int) -> int

      It converts a decimal amount, given as a string, to an integer number of minor units for a currency with `exponent` decimal places (2 for cents, 0 for a currency without minor units, 3 for thousandths). When the amount has more decimal places than the currency, round half to even (banker's rounding). The result must be exact: do not go through binary floating point.

      Format of `amount`: an optional leading "-", one or more ASCII digits, then optionally a "." followed by one or more ASCII digits. Examples: "12", "12.5", "-0.125". Raise ValueError for anything else, for example "", "1.", ".5", "1,5", " 1", "+1", "1e2".

      `exponent` must be between 0 and 4 inclusive; raise ValueError otherwise. A negative zero result is 0.
    expected_answer: "A module whose function to_minor_units passes eval/code_reference/CQ-03_tests.py."
    match:
      type: reference_tests
      function: to_minor_units
      tests: eval/code_reference/CQ-03_tests.py
    category: numeric
    expected_route: mid
    difficulty: hard
    reference_solution: eval/code_reference/CQ-03.py
    broken_solutions:
      - eval/code_reference/CQ-03_broken_1.py
      - eval/code_reference/CQ-03_broken_2.py
    notes: "Half-even on the decimal value. 0.575 with exponent 2 is 58 exactly and 57 through a float, and 90071992547409.93 does not fit a float at all; 0.285 is 28 and 0.295 is 30."

  - id: CQ-04
    question: |
      Write a Python function with this signature:

      def crc16(data: bytes) -> int

      It returns the CRC-16/CCITT-FALSE checksum of `data` as an integer from 0 to 0xFFFF. Parameters: polynomial 0x1021, initial value 0xFFFF, no reflection of input or output, no final XOR.

      For each byte: XOR the byte into the high byte of the 16-bit register, then repeat eight times: if the top bit of the register is set, shift the register left by one and XOR it with 0x1021, otherwise only shift it left by one. Keep the register to 16 bits. The checksum of empty data is the initial value.
    expected_answer: "A module whose function crc16 passes eval/code_reference/CQ-04_tests.py."
    match:
      type: reference_tests
      function: crc16
      tests: eval/code_reference/CQ-04_tests.py
    category: encoding
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-04.py
    broken_solutions:
      - eval/code_reference/CQ-04_broken_1.py
      - eval/code_reference/CQ-04_broken_2.py
    notes: "0x29B1 for b'123456789' is the catalogue check value of CRC-16/CCITT-FALSE. The 256-byte value comes from the reference solution."

  - id: CQ-05
