  - id: CQ-15
    question: |
      Write a Python function with this signature:

      def decode_varint(data: bytes, offset: int = 0) -> tuple[int, int]

      It decodes one unsigned variable-length integer (LEB128, as used by Protocol Buffers) that starts at data[offset]. Each byte carries seven bits of the value in its low seven bits, least significant group first. A byte whose top bit (0x80) is set is followed by another byte; the byte whose top bit is clear is the last one.

      Return a tuple (value, next_offset), where next_offset is the index of the byte after the last byte of this integer. Bytes after the integer are ignored.

      Raise ValueError when the data ends before a byte with a clear top bit is found (this includes an offset at or past the end of the data), and when the integer is longer than 10 bytes.
    expected_answer: "A module whose function decode_varint passes eval/code_reference/CQ-15_tests.py."
