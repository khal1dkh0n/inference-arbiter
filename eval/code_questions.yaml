      def merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]

      Each interval is a pair (start, end) of integers and covers every integer from start to end inclusive. The input is in no particular order. Merge all intervals that overlap or are adjacent: two intervals are adjacent when one ends at n and the other starts at n + 1. Return the merged intervals as tuples, sorted by start.

      Raise ValueError if any interval has start greater than end. An empty list returns an empty list. Do not modify the input list.
