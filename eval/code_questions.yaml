  - id: CQ-06
    question: |
      Write a Python function with this signature:

      def is_valid_iban(iban: str) -> bool

      It checks an IBAN by these rules and returns True or False. It never raises for a string argument.

      1. Remove every space character, then convert to uppercase.
      2. The result must be 15 to 34 characters long and contain only the letters A-Z and the digits 0-9. Its first two characters must be letters and its third and fourth characters must be digits. Otherwise return False.
      3. Move the first four characters to the end.
      4. Replace every letter by two digits: A is 10, B is 11, and so on up to Z, which is 35.
      5. Read the result as one decimal integer. The IBAN is valid when that integer modulo 97 equals 1.

      Do not check country codes or country-specific lengths.
    expected_answer: "A module whose function is_valid_iban passes eval/code_reference/CQ-06_tests.py."
    match:
      type: reference_tests
      function: is_valid_iban
      tests: eval/code_reference/CQ-06_tests.py
    category: rules
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-06.py
    broken_solutions:
      - eval/code_reference/CQ-06_broken_1.py
      - eval/code_reference/CQ-06_broken_2.py
    notes: "The mod-97 rule only, stated in full in the question. The valid examples are the usual published sample IBANs."

  - id: CQ-07
