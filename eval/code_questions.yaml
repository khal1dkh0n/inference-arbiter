  - id: CQ-17
    question: |
      Write a Python function with this signature:

      def compare_versions(a: str, b: str) -> int

      It compares two version strings and returns -1 when `a` is lower than `b`, 1 when `a` is higher, and 0 when they are equal in precedence. Both strings are well formed; no validation is needed.

      A version is MAJOR.MINOR.PATCH, three non-negative integers. It may be followed by "-" and a pre-release (identifiers separated by dots; an identifier may itself contain hyphens), and then by "+" and build metadata. Examples: "1.4.0", "2.0.0-rc.1", "1.0.0-alpha+001", "1.0.0+20130313".

      Rules:
      1. Build metadata is ignored.
      2. Compare MAJOR, then MINOR, then PATCH, as numbers.
      3. When those are equal, a version with a pre-release is lower than one without.
      4. Two pre-releases are compared identifier by identifier, left to right. Identifiers made only of digits are compared as numbers. An identifier made only of digits is lower than one that contains letters or hyphens. Two identifiers with letters or hyphens are compared as ASCII strings. When all shared identifiers are equal, the pre-release with fewer identifiers is lower.
    expected_answer: "A module whose function compare_versions passes eval/code_reference/CQ-17_tests.py."
    match:
      type: reference_tests
      function: compare_versions
      tests: eval/code_reference/CQ-17_tests.py
    category: rules
    expected_route: mid
    difficulty: hard
    reference_solution: eval/code_reference/CQ-17.py
    broken_solutions:
      - eval/code_reference/CQ-17_broken_1.py
      - eval/code_reference/CQ-17_broken_2.py
    notes: "The precedence rules are stated in the question; the chain alpha < alpha.1 < alpha.beta < beta < beta.2 < beta.11 < rc.1 < release is the one the semantic versioning specification gives."

  - id: CQ-18
    question: |
      Write a Python function with this signature:

      def wrap_text(text: str, width: int) -> list[str]

      It breaks `text` into lines of at most `width` characters and returns the lines. Do not use the textwrap module.

      Rules:
      - Words are the pieces of `text` separated by any whitespace. Runs of whitespace count as one separator, and leading and trailing whitespace is ignored.
      - Lines are filled greedily: a word joins the current line, after a single space, when the line stays within `width`; otherwise it starts a new line.
      - A word longer than `width` first ends the current line, if that line has any words. The word is then cut into pieces of `width` characters. Every full piece is a line by itself. The final, shorter piece (if there is one) starts the next line, and the following words may join that line by the greedy rule.
      - No line is empty and no line starts or ends with a space. Text without words gives an empty list.
      - Raise ValueError when `width` is less than 1.
    expected_answer: "A module whose function wrap_text passes eval/code_reference/CQ-18_tests.py."
    match:
      type: reference_tests
      function: wrap_text
      tests: eval/code_reference/CQ-18_tests.py
    category: sequence
    expected_route: mid
    difficulty: hard
    reference_solution: eval/code_reference/CQ-18.py
    broken_solutions:
      - eval/code_reference/CQ-18_broken_1.py
      - eval/code_reference/CQ-18_broken_2.py
    notes: "The long-word rule is spelled out so that there is one right answer; the cases around the last piece are the discriminating ones."

