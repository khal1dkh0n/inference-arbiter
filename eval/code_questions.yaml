  - id: CQ-11
    question: |
      Write a Python function with this signature:

      def eval_rpn(tokens: list[str]) -> int

      It evaluates an integer expression in reverse Polish notation. Each token is either an integer (an optional leading "-" followed by one or more ASCII digits) or one of the operators "+", "-", "*", "/". An operator takes the two most recent values: for the tokens a, b, "-" the result is a - b, and for a, b, "/" it is a divided by b.

      Division is integer division that truncates toward zero, so -7 divided by 2 is -3. Results must be exact for integers of any size.

      Raise ZeroDivisionError on division by zero. Raise ValueError when the expression is malformed: an empty token list, a token that is neither an integer nor an operator, an operator with fewer than two values available, or more than one value left at the end.
    expected_answer: "A module whose function eval_rpn passes eval/code_reference/CQ-11_tests.py."
    match:
      type: reference_tests
      function: eval_rpn
      tests: eval/code_reference/CQ-11_tests.py
    category: numeric
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-11.py
    broken_solutions:
      - eval/code_reference/CQ-11_broken_1.py
      - eval/code_reference/CQ-11_broken_2.py
    notes: "Truncating division on negative operands, exact for big integers (int(a / b) is not), and the malformed cases."

  - id: CQ-12
    question: |
      Write a Python function with this signature:

      def normalize_path(path: str) -> str

      It normalises a POSIX-style path by text alone, without touching the file system and without using os.path or pathlib.

      Rules:
      - Split the path on "/". Empty segments and "." segments are dropped.
      - A ".." segment removes the segment before it, when there is one and it is not itself "..".
      - In an absolute path (one that starts with "/"), a ".." with nothing before it is dropped: the root has no parent.
      - In a relative path, a ".." with nothing to remove is kept.
      - An absolute result is "/" followed by the remaining segments joined with "/", or just "/" when none remain.
      - A relative result is the remaining segments joined with "/", or "." when none remain.
      - The result never ends with "/" unless it is the root itself. The empty string gives ".".
    expected_answer: "A module whose function normalize_path passes eval/code_reference/CQ-12_tests.py."
    match:
      type: reference_tests
      function: normalize_path
      tests: eval/code_reference/CQ-12_tests.py
    category: parsing
    expected_route: mid
    difficulty: medium
    reference_solution: eval/code_reference/CQ-12.py
    broken_solutions:
      - eval/code_reference/CQ-12_broken_1.py
      - eval/code_reference/CQ-12_broken_2.py
    notes: "The relative-path cases (leading .. kept, empty result is '.') are the ones a quick stack solution drops."

  - id: CQ-13
    question: |
      Write a Python function with this signature:

      def allocate(total: int, weights: list[int]) -> list[int]

      It splits `total`, a non-negative integer number of minor units, across the given integer weights by the largest remainder method, and returns one share per weight, in order:

      1. Each share starts as the floor of total * weight / sum(weights).
      2. The units still left over are handed out one at a time to the shares with the largest remainders, where a share's remainder is (total * weight) modulo sum(weights). When remainders are equal, the share with the lower index comes first.

      The shares always add up to `total`. Use exact integer arithmetic. Raise ValueError when `total` is negative, when `weights` is empty, when any weight is negative, or when the weights add up to zero.
    expected_answer: "A module whose function allocate passes eval/code_reference/CQ-13_tests.py."
    match:
      type: reference_tests
      function: allocate
      tests: eval/code_reference/CQ-13_tests.py
    category: numeric
    expected_route: mid
    difficulty: hard
    reference_solution: eval/code_reference/CQ-13.py
    broken_solutions:
      - eval/code_reference/CQ-13_broken_1.py
      - eval/code_reference/CQ-13_broken_2.py
    notes: "Largest remainder with the tie rule stated. 1000 over [3,3,3,1,7,11] was worked by hand: floors 107,107,107,35,250,392 leave 2 units, remainders 4,4,4,20,0,24, so index 5 and index 3 get one each."

