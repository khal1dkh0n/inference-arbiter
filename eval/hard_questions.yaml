      9F02060000000187505F2A020978

      Give the CRC as a decimal integer between 0 and 65535, on a final line of the form "Answer: <integer>".
    expected_answer: "41925"
    match:
      type: numeric
      value: 41925
      tolerance: 0
    category: executable
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HX-07.py
    notes: 41925 is 0xA3C5. All parameters and the standard check value are in the question, so nothing is recalled; the work is 112 shift-and-XOR steps, which is where a model without code execution slips. Asked for in decimal so the numeric grader can check it. Computed by the reference program, which also asserts the 0x29B1 check value.

  - id: HX-08
    question: |
      A terminal sends frames of the form STX (0x02), data bytes, ETX (0x03), LRC. The LRC is the XOR of every byte after STX up to and including ETX; STX itself is not included. Here is a frame without its LRC byte, in hex:

      02303230307C343736313733393030313031303131397C3030303030303031383735307C3937387CB9BCD408CC6C03

      What is the LRC byte? Give it as a decimal integer between 0 and 255, on a final line of the form "Answer: <integer>".
    expected_answer: "69"
    match:
      type: numeric
      value: 69
      tolerance: 0
    category: executable
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HX-08.py
    notes: 69 is 0x45. XOR of 46 bytes with STX excluded and ETX included (including STX gives 71, excluding ETX gives 70). Asked for in decimal because a two-character hex answer cannot be graded safely by substring. Computed by the reference program.

  - id: HX-10
    question: |
      This Python 3 code converts decimal amount strings to minor units and adds them up:

      def to_minor_units(amount):
          return int(float(amount) * 100)

      def batch_total(amounts):
          return sum(to_minor_units(amount) for amount in amounts)

      print(batch_total(["19.99", "4.35", "1.15", "0.29", "8.20", "2.50", "1.10", "16.90", "0.57", "1.13"]))

      What exactly does it print on a standard CPython build (IEEE 754 double precision floats)? Give a final line of the form "Answer: <integer>".
    expected_answer: "5610"
    match:
      type: numeric
      value: 5610
      tolerance: 0
    category: executable
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HX-10.py
    notes: The exact sum is 5618. int() truncates, and eight of the ten products fall just below the integer in binary floating point (1998, 434, 114, 28, 819, 250, 110, 1689, 56, 112), so the code prints 5610. Which amounts lose a cent cannot be reasoned out reliably without running it, which is the point of the case. Verified by running the code.

  - id: HX-11
    question: |
      This Python 3 function is meant to return the Luhn check digit for a payload (the number without its check digit). It contains one bug.

      def check_digit(payload):
          total = 0
          for i, ch in enumerate(reversed(payload)):
              d = int(ch)
              if i % 2 == 0:
                  d = d * 2 % 9
              total += d
          return (10 - total % 10) % 10

      It is called on these three payloads, in this order: "79927398719", "4929939187355", "371449635398439".

      Write down the three digits the function returns as written, followed by the three digits a correct Luhn check-digit function would return for the same payloads, as one 6-digit string (buggy results first, then correct results). Give it on a final line of the form "Answer: <six digits>".
    expected_answer: "205527"
    match:
      type: numeric
      value: 205527
      tolerance: 0
    category: executable
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HX-11.py
    notes: The bug is `d * 2 % 9` in place of "double, then subtract 9 if above 9". The two agree for every digit except 9, where the buggy form gives 0 and the correct form gives 9. Each payload has a 9 in a doubled position, so all three results differ (buggy 2, 0, 5; correct 5, 2, 7). Verified by running both versions.

