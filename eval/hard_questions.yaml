# Hard closed-book set, draft v2 (26 cases). Schema and scoring rules: eval/README.md
#
# Same schema as eval/golden_questions.yaml, so scripts/run_eval.py --golden loads it unchanged.
#
# Executable cases are marked with `category: executable` (ids HX-*): the answer is a value a
# short Python program computes from data given in the question. Select them with
# `--category executable`. The other categories are the existing `reasoning`, `domain` and `trap`.
#
# `reference` is an extra field the loader ignores: the standard-library program under
# eval/hard_reference/ that prints `expected_answer`. Every executable case has one, and so does
# every other case whose answer is computed. tests/test_hard_questions.py re-runs them all.
#
# No answer here was recalled: each computed answer is the printed output of its reference
# program. All input data is synthetic (the PAN 4761739001010119 is a public test number).
# Short hex results (CRC, LRC) are asked for as decimal integers so the numeric grader can check
# them; a bare two-digit hex string cannot be graded safely by substring.
version: 1
cases:
  # ---- executable (15) ----
  - id: HX-01
    question: |
      The hex string below is one BER-TLV data object as used in EMV. Parse it with these rules.

      Tag: one byte, unless the low five bits of the first byte are all 1 (first byte AND 0x1F = 0x1F); then more tag bytes follow, and the tag continues for as long as the byte just read has its top bit (0x80) set, the first byte without it being the last tag byte.
      Constructed: if bit 0x20 of the first tag byte is set, the value is itself a sequence of TLV objects; otherwise the value is primitive, opaque data that must not be parsed further.
      Length: one byte below 0x80 is the length; 0x81 means the next one byte is the length; 0x82 means the next two bytes are the length, big-endian.

      7781849F2701809F360201A79F4B3079C4121FC60857DFFEFC74B999CC85F1909F0206000000004200AC46C8BCDF728E70FE5F2A0208406CCE861E33E6B0EA9F10120110A040032200009F0206000000990000FFBF0C139F4D020B0A9F02060000000187505F2A0209789F26086FE62AADA4D044EA57104761739001010119D291220112345678

      Exactly one data object with tag 9F02 (Amount, Authorised: 6 bytes of BCD, in minor units) exists in the parsed structure. What amount does it hold? Give it as a decimal integer of minor units, on a final line of the form "Answer: <integer>".
    expected_answer: "18750"
    match:
      type: numeric
      value: 18750
      tolerance: 0
    category: executable
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HX-01.py
    notes: Two-byte tags, a long-form (0x81) length on the outer template and a nested BF0C template. The byte sequence 9F0206 also occurs inside the primitive values of 9F4B (amount 4200) and 9F10 (amount 990000), so a substring search gives a wrong amount; only a real walk finds 18750. Computed by the reference program.

  - id: HX-02
    question: |
      The hex string below is one BER-TLV data object. Parse it completely with these rules.

      Tag: one byte, unless the low five bits of the first byte are all 1 (first byte AND 0x1F = 0x1F); then more tag bytes follow, and the tag continues for as long as the byte just read has its top bit (0x80) set, the first byte without it being the last tag byte.
      Constructed: if bit 0x20 of the first tag byte is set, the value is itself a sequence of TLV objects; otherwise the value is primitive and is not parsed further.
      Length: one byte below 0x80 is the length; 0x81 means the next one byte is the length; 0x82 means the next two bytes are the length, big-endian. A long form may be used for a small length.
      Padding: a 0x00 byte where a tag is expected, inside any constructed value, is padding and is skipped.

      E181539F1A020826008407A0000000041010A58132500544454249548701010000BF0C8200129F4D020B0A004203465F20DF8129039F0A049F380C9F66049F02069F37045F2A025F2D04656E6465DF813004A5038701

      Counting at every nesting level, how many value bytes in total are held by primitive data objects? (Tag bytes, length bytes, padding bytes and the constructed objects themselves are not counted.) Give a final line of the form "Answer: <integer>".
    expected_answer: "43"
    match:
      type: numeric
      value: 43
      tolerance: 0
    category: executable
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HX-02.py
    notes: Three levels of nesting (E1, A5, BF0C), three-byte tags (DF8129, DF8130), non-minimal long-form lengths (81 32, 82 0012), padding bytes, and primitive values that look like TLV (9F38 holds a DOL, DF8130 holds A5 03 87 01). Ten primitives with lengths 2+7+5+1+2+3+3+12+4+4 = 43. Computed by the reference program.

  - id: HX-03
    question: |
      A card returns this Data Object List (a sequence of tag and length pairs, with no values; tags are one byte unless the low five bits of the first byte are all 1, in which case the tag is two bytes):

      9F02049F03069F1A0395055F2A029A039C019F37045F200A9F4C049F35019F21029F1E04

      The terminal holds these values (tag, format, value in hex):

      9F02  n   000000018750
      9F03  n   000000000000
      9F1A  n   0826
      95    b   0080008000
      5F2A  n   0978
      9A    n   271122
      9C    n   00
      9F37  b   3C91A7E2
      5F20  an  444F452F4A
      9F35  n   22
      9F21  n   143005
      9F1E  an  54524D3030303432

      Build the data field: the values in the order the list asks for them, each made exactly as long as the list asks, concatenated with no tags or lengths. Rules: if the terminal has no value for a tag, use zero bytes (0x00) of the requested length. If the terminal's value is longer than requested, a format n value loses its leftmost bytes and any other format loses its rightmost bytes. If it is shorter than requested, a format n value is padded on the left with 0x00 and any other format is padded on the right with 0x00.

      Give the resulting data field as one uppercase hex string with no spaces, on a final line of the form "Answer: <hex>".
    expected_answer: "0001875000000000000000082600800080000978271122003C91A7E2444F452F4A00000000000000000022300554524D30"
    match:
      type: contains
      any_of:
        - "0001875000000000000000082600800080000978271122003C91A7E2444F452F4A00000000000000000022300554524D30"
        - "00 01 87 50 00 00 00 00 00 00 00 08 26 00 80 00 80 00 09 78 27 11 22 00 3C 91 A7 E2 44 4F 45 2F 4A 00 00 00 00 00 00 00 00 00 22 30 05 54 52 4D 30"
    category: executable
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HX-03.py
    notes: DOL processing with every rule exercised. 9F02 is truncated on the left (n), 9F1A padded on the left, 5F20 padded on the right, 9F4C is absent and zero-filled, 9F21 truncated on the left, 9F1E truncated on the right. The answer is 49 bytes; `contains` accepts the string with no spaces or with one space between bytes, in any letter case, and is long enough that no wrong answer can hold it by accident. The padding and truncation rules are stated in the question (they follow EMV Book 3 section 5.4 as recalled, but nothing depends on the recall). Computed by the reference program.

  - id: HX-04
    question: |
      Below is one ISO 8583 message in an all-ASCII encoding: a 4-digit message type, then the primary bitmap as 16 hex characters, then the data elements in ascending order. Bit 1 is the most significant bit of the bitmap. If bit 1 is set, a secondary bitmap (16 more hex characters, covering data elements 65 to 128) follows the primary bitmap, before the first data element.

      Data element formats used by this interface (length in characters; LLVAR means a 2-digit decimal length followed by that many characters):

      2 LLVAR, 3 fixed 6, 4 fixed 12, 7 fixed 10, 11 fixed 6, 12 fixed 6, 13 fixed 4, 18 fixed 4, 22 fixed 3, 25 fixed 2, 32 LLVAR, 35 LLVAR, 37 fixed 12, 41 fixed 8, 42 fixed 15, 49 fixed 3, 100 LLVAR, 102 LLVAR

      0200F238448128C080000000000014000000164761739001010119003000000000018750112214300500412715300511225411051000840012877314761739001010119D29122011234567632614004127414001280004140012877009781141400128774100041400128

      What is the value of data element 41? Give it on a final line of the form "Answer: <value>".
    expected_answer: "41400128"
    match:
      type: numeric
      value: 41400128
      tolerance: 0
    category: executable
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HX-04.py
    notes: Needs the bitmap decoded correctly (elements 2, 3, 4, 7, 11, 12, 13, 18, 22, 25, 32, 35, 37, 41, 42, 49, 100, 102), the secondary bitmap skipped, and three LLVAR fields walked before element 41. The neighbouring fields are built from the same digit groups (32 is 40012877, 42 is 000414001287700), so a misaligned parse gives a plausible wrong value. Element 41 is all digits here, so the numeric grader checks it. Computed by the reference program, which also asserts the parse consumes the whole message.

  - id: HX-07
