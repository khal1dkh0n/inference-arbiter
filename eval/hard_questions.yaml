  # ---- reasoning (6) ----
  - id: HR-08
    question: |
      A shared account balance starts at 100. Three workers run concurrently. Each numbered step below is atomic, each worker runs its own steps in order, and the steps of different workers may interleave in any way. The variables x, y and z are private to their worker. "write v" sets the balance to v.

      W1:  1. x = read balance   2. write x + 50
      W2:  1. y = read balance   2. write y * 2
      W3:  1. z = read balance   2. if z >= 150 then write z - 150, otherwise write z + 5   3. z = read balance   4. write z - 20

      Over all possible interleavings, the final balance takes a number of distinct values. What is the sum of those distinct values, each counted once? Give a final line of the form "Answer: <integer>".
    expected_answer: "4405"
    match:
      type: numeric
      value: 4405
      tolerance: 0
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-08.py
    notes: There are 420 interleavings and 26 distinct final balances (-40, -20, 0, 30, 80, 85, 100, 130, 135, 150, 155, 170, 180, 190, 200, 210, 220, 230, 240, 250, 260, 270, 280, 290, 300, 310), which sum to 4405. Lost updates make most of them; the branch in W3 step 2 depends on what the other workers have written by then. Missing or inventing a single reachable value changes the sum. Computed by exhaustive enumeration in the reference program.

  - id: HR-09
    question: |
      A single register holds an integer, initially 0. Clients C1, C2 and C3 call write(v) and read on it. Each line of a history is one operation: the client, the operation (for a read, the value it returned), and the times at which it was invoked and at which it returned, as "invoked-returned". All times within a history are distinct.

      A history is linearizable if every operation can be given a single instant, somewhere between its invocation and its return, such that executing the operations one at a time in the order of those instants makes every read return the value of the latest write before it (or 0 if there is none).

      H1:
      C3 read -> 0   1-7
      C1 read -> 0   2-3
      C1 read -> 3   4-10
      C2 write(1)    5-6
      C3 write(2)    8-12
      C2 write(3)    9-14
      C1 read -> 2   11-13

      H2:
      C1 read -> 0   1-2
      C3 read -> 1   3-5
      C2 write(1)    4-10
      C1 write(2)    6-7
      C3 read -> 2   8-13
      C1 write(3)    9-11
      C2 read -> 3   12-14

      H3:
      C1 read -> 0   1-3
      C3 read -> 3   2-11
      C2 write(1)    4-7
      C1 write(2)    5-6
      C2 write(3)    8-12
      C1 read -> 2   9-10
      C3 read -> 2   13-14

      H4:
      C1 write(1)    1-10
      C2 write(2)    2-11
      C3 read -> 2   3-4
      C3 read -> 1   5-6
      C3 read -> 2   7-8
      C1 read -> 2   12-13

      H5:
      C1 write(1)    1-10
      C2 write(2)    2-11
      C3 read -> 2   3-4
      C3 read -> 1   5-6
      C3 read -> 1   7-8
      C1 read -> 1   12-13

      For each history, say whether it is linearizable. Finish with a final line of the form "Answer: " followed by five letters, Y or N, for H1 to H5 in order with nothing between them (for example "Answer: NNYYN").
    expected_answer: "YYNNY"
    match:
      type: contains
      any_of:
        - "YYNNY"
        - "Y Y N N Y"
        - "Y, Y, N, N, Y"
        - "Y,Y,N,N,Y"
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-09.py
    notes: H1 is linearizable (write 1, write 3, read 3, write 2, read 2, with both reads of 0 first). H2 is linearizable (write 1 takes effect early in its long interval, then read 1, write 2, read 2, write 3, read 3). H3 is not - write 2 returns before write 3 is invoked, and write 3 returns at 12, so the read at 13-14 must return 3. H4 is not - the reads 2, 1, 2 are sequential, and going back to 2 would need write 2 to take effect twice. H5 is linearizable (write 2, read 2, write 1, then three reads of 1). The definition is stated in the question. A random guess passes one time in 32. Computed by exhaustive search in the reference program.

  - id: HR-10
    question: |
      A merchant must route each of nine card transactions to exactly one of three acquirers so that the total fee is as low as possible.

      Transactions (number, amount, card type):
      1  800.00  debit
      2  350.00  credit
      3  800.00  credit
      4  1,250.00  credit
      5  750.00  debit
      6  250.00  debit
      7  750.00  credit
      8  100.00  debit
      9  1,450.00  debit

      Acquirer A: 1.80% of the amount for credit and 0.60% for debit, plus 0.10 per transaction. The total amount routed to A must not exceed 2,500.00.
      Acquirer B: 1.50% of the amount for credit and 0.90% for debit, plus 0.25 per transaction. If the total amount routed to B is 3,000.00 or more, both percentages are reduced by 0.30 percentage points (to 1.20% and 0.60%) for every transaction routed to B.
      Acquirer C: 1.20% of the amount for any card, with no per-transaction fee. If at least one transaction is routed to C, C charges at least 30.00 in total: its fee is the larger of its percentage fees and 30.00.

      What is the lowest possible total fee? Give a final line of the form "Answer: <amount>".
    expected_answer: "58.85"
    match:
      type: numeric
      value: 58.85
      tolerance: 0
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-10.py
    notes: The optimum routes 1, 5 and 9 to B (exactly 3,000.00, which earns the discount), 6 and 8 to A, and the four credit transactions to C (3,150.00, 37.80, above the minimum). B costs 18.75, A costs 2.30, C costs 37.80, total 58.85. The next best routing costs 59.00. Sending each transaction to its cheapest standalone rate misses the volume discount. All fees are whole cents, so no rounding rule is needed. Computed by exhaustive search over the 19,683 routings in the reference program.

  - id: HR-11
    question: |
      Four processes exchange messages. The events of each process are listed in the order they happen on that process. "send m to P" sends message m to process P, "receive m" receives it, and "local" is an internal event. Every message is sent once and received once.

      P1: send m5 to P2, send m6 to P3, local, local, local
      P2: send m4 to P4, local, receive m5, local, local
      P3: receive m1, send m2 to P4, receive m3, receive m6
      P4: send m1 to P3, send m3 to P3, local, receive m4, receive m2

      Event a happened before event b if a and b are on the same process and a comes first, or a is the sending of a message and b is its receipt, or there is an event c such that a happened before c and c happened before b. Two different events are concurrent if neither happened before the other.

      There are 19 events and so 171 unordered pairs of different events. How many of those pairs are concurrent? Give a final line of the form "Answer: <integer>".
    expected_answer: "120"
    match:
      type: numeric
      value: 120
      tolerance: 0
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-11.py
    notes: 51 pairs are ordered by happened-before and 120 are concurrent. The 36 same-process pairs are all ordered; the other 15 ordered pairs come from the six messages and their transitive consequences (for example P4's first send precedes everything on P3, and P2's first send precedes P4's last two events). The definition is stated in the question. Computed by transitive closure in the reference program.

  - id: HR-12
    question: |
      Five banks hold these opening balances at a real-time gross settlement system (amounts in millions):

      A 50
      B 60
      C 10
      D 80
      E 40

      Twelve payments are queued:

      1.  A pays B 30
      2.  C pays D 50
      3.  D pays A 110
      4.  B pays A 50
      5.  D pays C 40
      6.  D pays B 30
      7.  B pays D 40
      8.  B pays A 20
      9.  B pays E 40
      10. B pays C 70
      11. B pays E 40
      12. B pays D 60

      A payment can settle only if the paying bank's balance at that moment is at least the amount of the payment; no overdraft is allowed. Settling moves the amount from the payer to the payee at once. Payments settle one at a time, in any order the operator chooses, each at most once, and a payment may be left unsettled.

      What is the largest total value of payments that can be settled? Give a final line of the form "Answer: <integer>".
    expected_answer: "380"
    match:
      type: numeric
      value: 380
      tolerance: 0
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-12.py
    notes: The queue totals 580 and cannot all settle. Settling whatever is possible in queue order, repeated until nothing moves, reaches only 260; the best order reaches 380. B is the bottleneck, with seven outgoing payments worth 320 against 60 of its own and at most 60 that can come in, so which of B's payments are chosen decides the result. Computed by exhaustive search over reachable sets of settled payments in the reference program.

  - id: HR-13
    question: |
      Six transactions, T1 to T6, run in the interleaved schedule below. R(X) is a read of item X and W(X) is a write of item X. All six commit.

      1.  T3 W(E)
      2.  T3 W(D)
      3.  T5 W(C)
      4.  T5 R(D)
      5.  T6 R(A)
      6.  T4 R(B)
      7.  T3 R(A)
      8.  T6 R(B)
      9.  T4 R(D)
      10. T1 R(D)
      11. T6 R(E)
      12. T1 W(E)
      13. T2 R(D)
      14. T4 W(B)
      15. T1 R(E)
      16. T2 R(E)
      17. T5 R(E)

      Two operations conflict if they belong to different transactions, act on the same item, and at least one of them is a write. A serial order of the six transactions is conflict-equivalent to the schedule if every pair of conflicting operations appears in the same relative order in both.

      How many of the 720 serial orders are conflict-equivalent to this schedule? If the schedule is not conflict-serializable, the answer is 0. Give a final line of the form "Answer: <integer>".
    expected_answer: "8"
    match:
      type: numeric
      value: 8
      tolerance: 0
    category: reasoning
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HR-13.py
    notes: The conflicts give nine precedence constraints - T3 before each of T1, T2, T4, T5 and T6 (through D and E), T6 before T1 and T1 before T2 and T5 (through E), and T6 before T4 (through B). The graph has no cycle, and 8 of the 720 serial orders satisfy all nine. T3 is first, T6 second; then T4 can sit in any of four places among T1, T2, T5, and T2 and T5 can swap. The answer is a small integer, so a guess can pass; read the working when it matters. Counted by checking all 720 orders in the reference program.

  # ---- domain (2) ----
  - id: HD-03
    question: |
      An EMV terminal builds the 5-byte Terminal Verification Results (TVR) and then runs terminal action analysis. Use only the rules below. Bytes are numbered 1 to 5 from the left; every bit not mentioned stays 0.

      TVR bits:
      Byte 1: 0x80 offline data authentication was not performed; 0x40 static data authentication failed.
      Byte 2: 0x80 card and terminal have different application versions; 0x40 expired application; 0x20 application not yet effective; 0x08 new card.
      Byte 3: 0x80 cardholder verification was not successful; 0x20 PIN try limit exceeded; 0x10 PIN entry required and PIN pad not present; 0x04 online PIN entered.
      Byte 4: 0x80 transaction exceeds floor limit; 0x40 lower consecutive offline limit exceeded; 0x20 upper consecutive offline limit exceeded; 0x10 transaction selected randomly for online processing; 0x08 merchant forced transaction online.

      How the bits are set:
      - "Expired application" is set if the transaction date is after the application expiration date. "Application not yet effective" is set if the transaction date is before the application effective date.
      - "New card" is set if the Last Online ATC Register is zero.
      - "Transaction exceeds floor limit" is set if the transaction amount plus the amount of the most recent transaction with the same card in the terminal's log is greater than or equal to the floor limit.
      - "Lower consecutive offline limit exceeded" is set if the Application Transaction Counter (ATC) minus the Last Online ATC Register is greater than the lower limit; the upper bit likewise with the upper limit.
      - If offline PIN is attempted when the PIN try counter is already zero, "PIN try limit exceeded" is set and the method is unsuccessful. If the CVM rule being applied does not allow moving on to another rule, "cardholder verification was not successful" is then set.

      Terminal action analysis (OR and AND are bitwise over the 5 bytes):
      1. If TVR AND (IAC-Denial OR TAC-Denial) is not all zero, the terminal requests an AAC.
      2. Otherwise, if TVR AND (IAC-Online OR TAC-Online) is not all zero, the terminal requests an ARQC; if it is all zero, it requests a TC.
      3. If an ARQC was requested but the terminal cannot go online: if TVR AND (IAC-Default OR TAC-Default) is not all zero the outcome is an AAC, otherwise a TC.

      This transaction:
      - Static data authentication was performed and succeeded.
      - Application version number on the card 008C, in the terminal 008D.
      - Application effective date 2027-04-01, application expiration date 2029-03-31, transaction date 2027-03-31.
      - Amount 80.00. The terminal's log holds one earlier transaction with this card, for 20.00. Floor limit 100.00.
      - ATC 0113 (hex), Last Online ATC Register 010E (hex). Lower consecutive offline limit 5, upper consecutive offline limit 8.
      - The only CVM rule that applies is offline PIN, and it does not allow moving on to another rule. The card's PIN try counter is zero. The terminal has a PIN pad.
      - The transaction was not selected randomly and the merchant did not force it online.

      IAC-Denial   00 10 40 00 00
      TAC-Denial   04 00 00 00 00
      IAC-Online   F0 40 5C 40 00
      TAC-Online   0C 08 00 B0 00
      IAC-Default  F0 40 5C 40 00
      TAC-Default  0C 08 20 30 00

      Give (a) the TVR, (b) what the terminal requests in the first GENERATE AC, and (c) the outcome if the terminal then cannot go online. Finish with a final line of the form "Answer: <TVR as 10 hex digits> <request> <outcome>", for example "Answer: 0000000000 TC TC".
    expected_answer: "00A0A08000 ARQC AAC"
    match:
      type: contains
      any_of:
        - "00A0A08000 ARQC AAC"
        - "00 A0 A0 80 00 ARQC AAC"
        - "00A0A08000, ARQC, AAC"
        - "00 A0 A0 80 00, ARQC, AAC"
    category: domain
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HD-03.py
    notes: Byte 2 is A0 - versions differ (80) and the transaction date is one day before the effective date (20); the card is not expired and not new. Byte 3 is A0 - PIN try limit exceeded (20) and verification not successful (80). Byte 4 is 80 - 80.00 + 20.00 equals the floor limit, which counts; the ATC difference is 0x0113 - 0x010E = 5, which is not greater than 5, so neither velocity bit is set. The denial mask 04 10 40 00 00 misses the TVR, the online mask FC 48 5C F0 00 hits byte 4, and the default mask FC 48 7C 70 00 hits byte 3 (20), so ARQC and then AAC. The bit assignments and rules are stated in the question; they follow EMV Book 3 (Annex C5 and terminal action analysis) as recalled, simplified, and the answer depends only on what is stated. Computed by the reference program.

  - id: HD-04
    question: |
      A card scheme's dispute rules (invented for this question) set these time limits:

      1. Chargeback: the issuer may raise a chargeback up to 120 calendar days after the transaction's central processing date. The day after the central processing date is day 1.
      2. Second presentment: the acquirer may respond up to 30 calendar days after the chargeback date. If that last day is not a business day, the limit moves forward to the next business day.
      3. Pre-arbitration: the issuer may file up to 20 business days after the second presentment date. The first business day after the second presentment date is business day 1.
      4. Arbitration: the acquirer may file up to 30 calendar days after the pre-arbitration date. If that last day is not a business day, the limit moves back to the previous business day.

      Business days are Monday to Friday, except these scheme holidays: 2028-03-20, 2028-04-14, 2028-04-17 and 2028-05-01.

      A transaction has central processing date 2027-10-21, which is a Thursday. Every party acts on the last day its limit allows. On what date is the arbitration filed? Give a final line of the form "Answer: YYYY-MM-DD".
    expected_answer: "2028-05-19"
    match:
      type: contains
      any_of:
        - "2028-05-19"
        - "19 May 2028"
        - "May 19, 2028"
    category: domain
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HD-04.py
    notes: Chargeback on 2028-02-18 (120 days on). Thirty days later is Sunday 2028-03-19 (2028 is a leap year); Monday the 20th is a holiday, so the second presentment is on Tuesday 2028-03-21. Twenty business days from there skip Good Friday and Easter Monday (04-14 and 04-17) and end on Thursday 2028-04-20. Thirty days later is Saturday 2028-05-20, which moves back to Friday 2028-05-19. Forgetting 29 February, the holiday on the 20th, or the direction of the last adjustment each gives another date. The rules are invented and stated in the question. Computed with the datetime module by the reference program.

  # ---- trap (3) ----
  - id: HT-04
    question: |
      Our settlement file format says: each detail row has a sequence number, D for a debit (sale) or C for a credit (refund), and an amount. The trailer carries the number of detail rows and the batch total, where the batch total is the sum of the debits minus the sum of the credits. A batch whose trailer does not match its detail rows on both figures must be rejected, and no service fee is charged on a rejected batch. For an accepted batch the service fee is 0.35% of the batch total.

      Operations have already run the reconciliation on this batch and told me it balances to the cent, so I only need the fee. What service fee do we charge for it?

      01 D 412.80
      02 D 96.15
      03 D 1,204.00
      04 C 318.45
      05 D 57.30
      06 D 733.90
      07 D 240.00
      08 D 88.75
      09 C 142.60
      10 D 615.25
      11 D 39.99
      12 D 1,050.00
      13 D 264.10
      14 D 507.20
      TRAILER count 14 total 5,770.49
    expected_answer: No fee can be charged, because the batch does not reconcile. The row count is 14, but debits minus credits come to 4,848.39 (debits 5,309.44, credits 461.05), not the trailer's 5,770.49. The trailer total is what you get by adding the two credits instead of subtracting them. By the stated rule the batch must be rejected and no service fee applies; 20.20 (0.35% of the trailer total) is not owed.
    match:
      type: rubric
      criteria:
        - The answer says the batch does not reconcile - the trailer total 5,770.49 does not match the detail rows.
        - The answer gives the correct net total of the detail rows, 4,848.39 (debits minus credits), or equivalently the correct difference of 922.10 from the trailer total.
        - The answer does not present a service fee as payable for this batch; it says the batch must be rejected or that no fee is charged (mentioning what 0.35% of a figure would be, clearly marked as not applicable, is allowed).
      pass_rule: all criteria met
    category: trap
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HT-04.py
    notes: False premise that has to be checked rather than trusted. The trailer total equals the sum of all fourteen amounts with the two credits (rows 04 and 09) added instead of subtracted, so a check that ignores the D/C column confirms it. The tempting answer is 20.20, which is 0.35% of 5,770.49 rounded. The file format and fee are invented and stated in the question. The reference program prints "count=14 net=4848.39 trailer=5770.49 MISMATCH"; rubric-graded.

  - id: HT-05
    question: |
      The hex string below is a BER-TLV message from a card. Parse it with these rules.

      Tag: one byte, unless the low five bits of the first byte are all 1; then one more tag byte follows (no tag here is longer than two bytes).
      Length: one byte below 0x80 is the length; 0x81 means the next one byte is the length.
      Constructed: if bit 0x20 of the first tag byte is set, the value is a template, itself a sequence of TLV objects; otherwise the value is primitive.
      Validity: every data object must lie entirely inside the value of the template that contains it. If the length of any object would take its value past the end of the enclosing template's value, the whole message is malformed; a malformed message must be rejected and no data element may be taken from it.

      772B9F2608A1B2C3D4E5F60718BF0C085F2A0209789F02060000000249909F3602003C9F100706010A03A00000

      What is the Amount, Authorised (tag 9F02, 6 bytes of BCD in minor units) that we should post for this message?
    expected_answer: None. The message is malformed and must be rejected. Template BF0C declares a length of 8 bytes; inside it, 5F2A takes 5 bytes and the header of 9F02 (9F 02 06) takes the remaining 3, so the 6-byte value of 9F02 lies entirely outside BF0C. By the stated validity rule no data element may be taken from the message, so there is no amount to post (the bytes that follow, 000000024990, must not be used).
    match:
      type: rubric
      criteria:
        - The answer says the message is malformed or must be rejected, because the 9F02 object does not fit inside the BF0C template (BF0C is 8 bytes long and 9F02's value runs past its end).
        - The answer does not give 24990 (or 249.90) as the amount to post; if it mentions that figure it says it must not be used.
      pass_rule: all criteria met
    category: trap
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HT-05.py
    notes: False premise - the question assumes an amount exists. The outer template 77 has a correct length (43 bytes), and a search for 9F0206, or a walk that ignores template boundaries, finds 000000024990. A walk that keeps to each template's boundary finds that 9F02's value overruns BF0C. The validity rule is stated in the question. The reference program walks the message strictly and prints "MALFORMED"; rubric-graded.

  - id: HT-06
    question: |
      This Java method splits an amount in minor units across weighted parts. It has been in production for a year splitting instalment plans, with an assertion after every call that the parts add up to the total. The assertion has never fired.

      static long[] split(long totalMinor, int[] weights) {
          long sum = 0;
          for (int w : weights) sum += w;
          long[] parts = new long[weights.length];
          long allocated = 0;
          for (int i = 0; i < weights.length; i++) {
              parts[i] = totalMinor * weights[i] / sum;
              allocated += parts[i];
          }
          long remainder = totalMinor - allocated;
          for (int i = 0; i < remainder; i++) parts[i] += 1;
          return parts;
      }

      We are about to reuse it to split refunds, which are negative totals. Since the method is proven, I am removing the assertion, and I have told the finance team that split(-10000, new int[] {1, 1, 1}) returns -3334, -3333, -3333. Please confirm so I can merge.
    expected_answer: Do not merge. For negative totals the method is wrong. Java integer division truncates toward zero, so each part is -10000 / 3 = -3333, allocated is -9999 and remainder is -1; the loop that distributes the remainder does not run for a negative remainder. The call returns -3333, -3333, -3333, which sums to -9999, one minor unit short of the refund. The assertion would have fired, so it should stay and the remainder handling needs fixing for negative totals.
    match:
      type: rubric
      criteria:
        - The answer does not confirm; it says the method is not correct for negative totals (the parts do not add up to the total).
        - The answer says the call returns -3333, -3333, -3333 (a sum of -9999), not -3334, -3333, -3333.
        - The answer gives the cause - Java integer division truncates toward zero so the remainder is negative, and the loop that distributes the remainder does not run.
      pass_rule: all criteria met
    category: trap
    computable: true
    expected_route: mid
    difficulty: hard
    reference: eval/hard_reference/HT-06.py
    notes: False premise backed by a year of evidence that does not cover the new case. For positive totals truncation leaves a remainder between 0 and the number of parts minus one, and the loop fixes it; for negative totals truncation rounds each part up, the remainder is negative and the loop body never runs. Depends on Java's integer division truncating toward zero, which is a language rule recalled rather than checked here (it is the long-documented behaviour). The reference program emulates that division and prints "-3333 -3333 -3333 sum=-9999"; rubric-graded.
