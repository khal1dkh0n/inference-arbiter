      Interchange rate, percent of the amount: CD D 0.20, CD X 1.15, CC D 0.30, CC X 1.50, CM D 1.75, CM X 2.00.

      For each row, the fee is the rate applied to the amount, rounded to a whole minor unit of the transaction currency with half-to-even rounding. Each rounded fee is then converted to EUR at these rates, without rounding: 1 USD = 0.92 EUR, 1 JPY = 0.0061 EUR, 1 KWD = 2.98 EUR. The converted fees are added up and the total is rounded once, half-to-even, to the euro cent.

      01 CD X KWD 000000401831
      02 CC D JPY 000000286463
      03 CC X USD 000000200699
      04 CD D USD 000000031250
      05 CM X EUR 000000044270
      06 CC X JPY 000000222579
      07 CD X USD 000000096353
      08 CD D USD 000000217716
      09 CC D USD 000000146397
      10 CC X JPY 000000278832
      11 CC X EUR 000000007700
      12 CD X EUR 000000248392
      13 CM D KWD 000000332514
      14 CD D EUR 000000040584
      15 CD D EUR 000000086244
      16 CM D USD 000000074277
      17 CC X JPY 000000124050
