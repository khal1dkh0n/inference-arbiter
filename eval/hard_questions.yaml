  - id: HX-13
    question: |
      This Python 3 function is meant to return the tags of all BER-TLV objects in a buffer, descending into constructed objects. It has bugs.

      def tags(data):
          out = []
          i = 0
          while i < len(data):
              tag = data[i]
              i += 1
              if tag & 0x1F == 0x1F:
                  tag = (tag << 8) | data[i]
                  i += 1
              length = data[i]
              i += 1
              if length & 0x80:
                  length = data[i]
                  i += 1
              out.append(tag)
              if not tag & 0x20:
                  i += length
          return out

      data = bytes.fromhex("7082002E9F4681039F02065A0847617390010101195F3401019F0702FF008E0A00000000000000001F039F0D05B450840000")
      print(sum(tags(data)))

      What exactly does this print? Trace the code as written; do not report what a correct parser would give. Give a final line of the form "Answer: <integer>".
    expected_answer: "32689"
    match:
      type: numeric
      value: 32689
      tolerance: 0
    category: executable
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HX-13.py
    notes: Two bugs. A long-form length always takes exactly one following byte as the length, so 82 00 2E is read as length 0 and the parser loses sync. The constructed test is applied to the combined two-byte tag, so 5F34 (low byte 0x34) is treated as constructed. The function returns [0x70, 0x2E, 0x81, 0x5A, 0x5F34, 0x01, 0x00, 0x00, 0x00, 0x1F03], sum 32689; a correct parser would give 0x70, 0x9F46, 0x5A, 0x5F34, 0x9F07, 0x8E, 0x9F0D. The last skip runs past the end of the buffer, which ends the loop without an error. Replaced the one-line operator-precedence case of the first draft (answered in 7 seconds). Verified by running the function.

  - id: HX-14
    question: |
      A card scheme signs a 16-byte data block with RSA. To recover the block, compute S^3 mod N, where S is the signed value and N the modulus, and write the result as 16 bytes, big-endian.

      N = B2764CD65A5BE7B2050CB0D5439DC0CD (hex)
      S = A6F67D445A09812EF39CCF5A55E7639D (hex)

      The recovered block has this layout: byte 1 is the header 0x6A; byte 2 is the format; bytes 3 to 6 are the issuer identifier as 8 BCD digits; bytes 7 and 8 are the expiry (MMYY, BCD); bytes 9 to 11 are a serial number; bytes 12 to 15 are other data; byte 16 is the trailer 0xBC.

      What is the issuer identifier? Give its 8 digits on a final line of the form "Answer: <eight digits>".
    expected_answer: "52846013"
    match:
      type: numeric
      value: 52846013
      tolerance: 0
    category: executable
    computable: true
    expected_route: frontier
    difficulty: hard
    reference: eval/hard_reference/HX-14.py
    notes: Toy version of EMV public key certificate recovery (128-bit modulus, exponent 3). One line of Python (pow(S, 3, N)); by hand it is two 39-digit multiplications and reductions, which is where a model without code execution fails. The recovered block is 6A 02 52846013 1230 00A7F3 01013C5E BC, and the reference program asserts the header and trailer. The layout is stated in the question and is a simplification, not the real EMV certificate format.

