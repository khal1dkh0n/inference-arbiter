[project]
name = "inference-arbiter"
version = "0.1.0"
description = "Transparent multi-model inference arbiter - Phase 1 bare-metal router"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only mcp mode needs this. Without it every other mode runs, and mcp mode ends with a typed error.
mcp = [
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_arbiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
